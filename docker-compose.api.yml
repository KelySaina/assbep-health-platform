# ============================================================================
# ASSBEP — production stack (API + Postgres + MinIO). The Vue frontends are on
# Vercel; nothing here serves them.
#
#   User ──► Caddy (on the host) ──► api    /api/*
#                                └──► minio  /storage/*
#
# This stack used to ship its own Caddy bound to 80:80/443:443, which meant it
# could not share a host with anything else wanting those ports. Routing and TLS
# are now the host's Caddy, shared with the other apps on this box; see
# deploy/caddy/assbep.caddyfile and scripts/caddy-site.sh.
# ============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: assbep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # MinIO deleted minio/minio and minio/mc from Docker Hub in September 2026 and
    # stopped serving them anonymously from quay.io days later, so `:latest` no
    # longer resolves at all. Chainguard's free source-built image of the same AGPL
    # server, pinned by digest because the free tier publishes no version tags —
    # and because a floating tag on the thing holding uploaded documents was always
    # the wrong shape. Re-pin deliberately:
    #   docker pull cgr.dev/chainguard/minio:latest
    #   docker image inspect cgr.dev/chainguard/minio:latest --format '{{index .RepoDigests 0}}'
    #
    # Runs as uid 65532 where MinIO's own ran as root. A volume that already holds
    # objects needs chowning once, with the stack down:
    #   docker run --rm -v assbep_minio_data:/d alpine chown -R 65532:65532 /d
    image: cgr.dev/chainguard/minio@sha256:a05a4497e8dce3cb7a7a1bf1872ba5d30ea988f1e8c22c9e0920503761c4b5f1
    container_name: assbep-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    ports:
      # Loopback only. Caddy serves the public /storage/* prefix from here; the
      # console on 9001 is published for an SSH tunnel and is routed nowhere.
      - "${BIND_HOST:-127.0.0.1}:${MINIO_HOST_PORT:-9100}:9000"
      - "${BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9101}:9001"
    healthcheck:
      # `mc ready local`, not curl: the Chainguard image ships no curl, wget or nc,
      # so the old probe could never pass — and it would not fail loudly either.
      # minio would simply never report healthy, and `api` waits on service_healthy,
      # so the stack would hang rather than error.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: assbep-api
    restart: unless-stopped
    ports:
      # Loopback only: the host Caddy proxies /api/* here. Postgres is not
      # published at all — nothing outside this network has business with it.
      - "${BIND_HOST:-127.0.0.1}:${API_HOST_PORT:-4100}:4000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: ${API_PORT:-4000}
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      DATABASE_LOGGING: ${DATABASE_LOGGING:-false}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-20971520}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      SESSION_SECRET: ${SESSION_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/programs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  postgres_data:
  minio_data: