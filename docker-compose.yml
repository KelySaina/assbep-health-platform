version: "3.8"

services:
  # ─── PostgreSQL Database ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: assbep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assbep
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assbep"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── MinIO (S3-Compatible Storage) ─────────────────────────
  minio:
    image: minio/minio:latest
    container_name: assbep-minio
    restart: unless-stopped
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── NestJS API ─────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: assbep-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/assbep?schema=public
      JWT_SECRET: assbep-secret-key-change-in-production
      PORT: "4000"
      CORS_ORIGIN: "https://admin-assbep.vercel.app,https://assbep.vercel.app,https://79.143.185.71.sslip.io,http://79.143.185.71.sslip.io,http://localhost:3000,http://localhost:3001"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: assbep-media
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: http://localhost:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/programs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Public Website (Vue 3) ────────────────────────────────
  public-website:
    build:
      context: ./public-website
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: assbep-public
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  # ─── Admin Backoffice (Vue 3) ──────────────────────────────
  admin-backoffice:
    build:
      context: ./admin-backoffice
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: assbep-admin
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
